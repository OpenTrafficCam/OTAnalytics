---
name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  out_dir: "dist/"

jobs:
  test:
    if: endsWith(github.event.base_ref, 'main')
    uses: "./.github/workflows/test.yml"
  regression-test:
    if: endsWith(github.event.base_ref, 'main')
    uses: "./.github/workflows/regression-test.yml"
    secrets:
      PLATOMO_OTC_TESTDATA_ACCESS: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
  publish-to-pypi:
    runs-on: ubuntu-latest
    needs:
      - test
      - regression-test
    environment:
      name: pypi
      url: https://pypi.org/p/OTAnalytics
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Update Python Package Version
        uses: platomo/update-version-py-action@6dc2a0b963fb203675c446234d858e7958bf4876 # v1.0.1
        with:
          version: ${{ github.ref_name }}
          file-path: "OTAnalytics"
      - name: Build a binary wheel and a source tarball
        shell: bash
        run: uv build --out-dir ${{ env.out_dir }}

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: ${{ env.out_dir }}

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
