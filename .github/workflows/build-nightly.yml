---
name: Build Nightly Version

on:
  # Creates Nightly Release of main
  # Needs: secrets.PLATOMO_BUILDER_ACCESS
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: "./.github/workflows/test.yml"
  regression-test:
    permissions:
      contents: read
    uses: "./.github/workflows/regression-test.yml"
    secrets:
      PLATOMO_OTC_TESTDATA_ACCESS: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
  create_nightly:
    permissions:
      contents: write
    needs:
      - test
      - regression-test
    uses: "platomo/GitHub-workflows/.github/workflows/reusable-create-release-with-assets.yml@a4deb65bd5188ee1115e902bbe19d949bf69fe62" # main
    secrets:
      PLATOMO_BUILDER_ACCESS: ${{ secrets.PLATOMO_BUILDER_ACCESS }}
    with:
      package-version: nightly
      package-path: OTAnalytics
      draft-release: false
      pre-release: true
      delete-existing: true
