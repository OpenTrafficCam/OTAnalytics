---
name: Benchmark Test With Pytest
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  packages: write

jobs:
  benchmark:
    name: Run pytest-benchmark benchmark
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Download test data
        run: |
          gh release download \
          --pattern 'OTCamera19_FR20_2023-05-24_06-00-00_11-45-00.zip' \
          --pattern 'OTCamera19_FR20_2023-05-24_00-00-00.zip' \
          -R platomo/OpenTrafficCam-testdata -D tests/data
        env:
          GH_TOKEN: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
      - name: Unzip test data
        run: |
          cd tests/data
          unzip ./\*.zip
          rm ./*.zip
          cd ..
      - name: Install the project
        shell: bash
        run: uv sync --locked --dev
      - name: Run benchmark tests
        run: uv run pytest ./tests/benchmark --benchmark-json output.json
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Python Benchmark with pytest-benchmark
          tool: "pytest"
          output-file-path: output.json
          auto-push: true
          alert-threshold: "200%"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          fail-on-alert: true
