---
name: Regression Test With Pytest
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      PLATOMO_OTC_TESTDATA_ACCESS:
        required: true

permissions: read-all

jobs:
  regression-test:
    name: Run pytest regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Download test data
        run: |
          gh release download \
          --pattern 'OTCamera19_FR20_2023-05-24_06-00-00_11-45-00.zip' \
          --pattern 'OTCamera19_FR20_2023-05-24_00-00-00.zip' \
          -R platomo/OpenTrafficCam-testdata -D tests/data
        env:
          GH_TOKEN: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
      - name: Unzip test data
        run: |
          cd tests/data
          unzip ./\*.zip
          rm ./*.zip
          cd ..
      - name: Install the project
        shell: bash
        run: uv sync --locked --dev
      - name: Run regression tests
        run: uv run pytest ./tests/regression
