---
name: Test

on:
  # Run tests each time a PR is opened or changed.
  # Allow other Workflows (e.g., build workflows) to call this workflow.
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Execute tests across various operating systems and Python versions.
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.12"]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.py }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Separate from the test steps so a stale uv.lock fails loudly and early.
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Static type checking
        run: uv run mypy OTAnalytics tests --config-file pyproject.toml
      - name: Run Python Unit Tests
        timeout-minutes: 60
        run: uv run pytest --cov=OTAnalytics tests/unit
