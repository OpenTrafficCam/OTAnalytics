---
name: Publish to TestPyPI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  out_dir: "dist/"

jobs:
  test:
    uses: "./.github/workflows/test.yml"
  regression-test:
    uses: "./.github/workflows/regression-test.yml"
    secrets:
      PLATOMO_OTC_TESTDATA_ACCESS: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
  publish-to-testpypi:
    runs-on: ubuntu-latest
    needs:
      - test
      - regression-test
    environment:
      name: testpypi
      url: https://test.pypi.org/p/OTAnalytics
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Fetch all tags
        run: git fetch --tags --unshallow

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Get latest tag and create new version
        id: get_version
        run: |
          # Get the latest tag in format v*.*.* (ignoring tags like "nightly")
          LATEST_TAG="$(git tag -l "v*.*.*" | sort -V | tail -n 1 || echo 'v0.0.0')"
          # Extract version without 'v' prefix
          VERSION="${LATEST_TAG#v}"
          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Increment patch version
          PATCH="$((PATCH + 1))"
          # Create new version with incremented patch
          INCREMENTED_VERSION="$MAJOR.$MINOR.$PATCH"
          DATE_TIME="$(date +'%Y%m%d%H%M%S')"
          NEW_VERSION="${INCREMENTED_VERSION}a${DATE_TIME}"
          echo "Final version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Python Package Version
        uses: platomo/update-version-py-action@6dc2a0b963fb203675c446234d858e7958bf4876 # v1.0.1
        with:
          version: ${{ steps.get_version.outputs.new_version }}
          file-path: "OTAnalytics"
      - name: Build a binary wheel and a source tarball
        shell: bash
        run: uv build --out-dir ${{ env.out_dir }}

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: ${{ env.out_dir }}

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ vars.PYPI_REPO_URL }}
