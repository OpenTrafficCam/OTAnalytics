---
name: Acceptance Test With Pytest
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  acceptance-test:
    name: Run pytest Acceptance test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Download test data
        run: |
          gh release download \
          --pattern 'OTCamera19_FR20_2023-05-24_06-00-00_11-45-00.zip' \
          --pattern 'OTCamera19_FR20_2023-05-24_00-00-00.zip' \
          -R platomo/OpenTrafficCam-testdata -D tests/data
        env:
          GH_TOKEN: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
      - name: Unzip test data
        run: |
          cd tests/data
          unzip ./\*.zip
          rm ./*.zip
          cd ..
      # Separate from the test steps so a stale uv.lock fails loudly and early.
      - name: Install dependencies
        run: uv sync --locked --dev
      # pytest-playwright runs headless Chromium by default, so the other browsers
      # (and their ~180 apt packages) aren't needed.
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Run acceptance tests
        timeout-minutes: 20
        run: uv run pytest --cov=OTAnalytics tests/acceptance
