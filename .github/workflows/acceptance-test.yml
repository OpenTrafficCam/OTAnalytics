---
name: Acceptance Test With Pytest
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  acceptance-test:
    name: Run pytest Acceptance test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Download test data
        run: |
          gh release download \
          --pattern 'OTCamera19_FR20_2023-05-24_06-00-00_11-45-00.zip' \
          --pattern 'OTCamera19_FR20_2023-05-24_00-00-00.zip' \
          -R platomo/OpenTrafficCam-testdata -D tests/data
        env:
          GH_TOKEN: ${{ secrets.PLATOMO_OTC_TESTDATA_ACCESS }}
      - name: Unzip test data
        run: |
          cd tests/data
          unzip ./\*.zip
          rm ./*.zip
          cd ..
      # Separate from the test steps so a stale uv.lock fails loudly and early.
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps
      - name: Run acceptance tests
        timeout-minutes: 20
        run: uv run pytest --cov=OTAnalytics tests/acceptance
